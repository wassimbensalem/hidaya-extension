<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nearby Mosques — Hidaya</title>
    <style>
        :root {
            --primary:       #1b6b3a;
            --primary-light: #eaf4ee;
            --primary-dark:  #145230;
            --bg:            #f5f4f0;
            --card:          #ffffff;
            --border:        #e4e4e0;
            --text:          #1a1a1a;
            --text-2:        #6b7280;
            --green:         #16a34a;
            --radius:        10px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            min-width: 340px;
            max-width: 480px;
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            font-size: 14px;
            line-height: 1.5;
        }

        /* Header */
        .page-header {
            background: var(--primary);
            padding: 14px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            color: white;
        }

        .back-btn {
            background: rgba(255,255,255,0.2);
            border: 1px solid rgba(255,255,255,0.35);
            color: white;
            border-radius: 6px;
            padding: 6px 12px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            flex-shrink: 0;
        }
        .back-btn:hover { background: rgba(255,255,255,0.3); }

        .page-title {
            font-size: 17px;
            font-weight: 700;
        }

        .page-subtitle {
            font-size: 12px;
            opacity: 0.75;
        }

        /* Content */
        .content {
            padding: 14px 16px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .section-label {
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 0.8px;
            text-transform: uppercase;
            color: var(--text-2);
            margin-bottom: 4px;
        }

        /* Mosque card */
        .mosque-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 12px 14px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .mosque-card-header {
            display: flex;
            gap: 10px;
            align-items: flex-start;
        }

        .mosque-card-icon {
            flex-shrink: 0;
            margin-top: 1px;
            color: var(--primary);
        }

        .mosque-card-title {
            flex: 1;
            min-width: 0;
        }

        .mosque-card-name {
            font-weight: 700;
            font-size: 14px;
            color: var(--primary);
            line-height: 1.3;
        }

        .mosque-card-address {
            font-size: 12px;
            color: var(--text-2);
            margin-top: 2px;
        }

        .mosque-card-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-top: 8px;
            border-top: 1px solid var(--border);
        }

        .mosque-card-dist {
            font-size: 12px;
            font-weight: 600;
            color: var(--green);
        }

        .mosque-card-btn {
            padding: 5px 12px;
            background: var(--primary);
            color: white;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            text-decoration: none;
            transition: opacity 0.15s;
        }
        .mosque-card-btn:hover { opacity: 0.85; }

        /* States */
        .loading-text, .empty-text {
            text-align: center;
            padding: 24px 16px;
            font-size: 13px;
            color: var(--text-2);
            font-style: italic;
        }

        .error-text {
            text-align: center;
            padding: 16px;
            font-size: 13px;
            color: #b91c1c;
            background: #fef2f2;
            border: 1px solid #fecaca;
            border-radius: var(--radius);
        }

        .retry-btn {
            display: block;
            margin: 8px auto 0;
            padding: 7px 18px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
        }
        .retry-btn:hover { opacity: 0.85; }
    </style>
</head>
<body>
    <div class="page-header">
        <button class="back-btn" id="back-btn">← Back</button>
        <div>
            <div class="page-title">Nearby Mosques</div>
            <div class="page-subtitle">Within 5 km · sorted by distance</div>
        </div>
    </div>

    <div class="content">
        <div class="section-label">Results</div>
        <div id="message" style="display:none;"></div>
        <div id="mosque-list">
            <div class="loading-text">Finding nearby mosques…</div>
        </div>
        <button class="retry-btn" id="retry-btn" style="display:none;">Try Again</button>
    </div>

    <script src="mosque.js"></script>
</body>
</html>
