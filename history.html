<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notification History — Hidaya</title>
    <style>
        :root {
            --primary:       #1b6b3a;
            --primary-light: #eaf4ee;
            --bg:            #f5f4f0;
            --card:          #ffffff;
            --border:        #e4e4e0;
            --text:          #1a1a1a;
            --text-2:        #6b7280;
            --green:         #16a34a;
            --orange:        #e65100;
            --red:           #dc2626;
            --red-light:     #fef2f2;
            --radius:        10px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            min-width: 340px;
            max-width: 520px;
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            font-size: 14px;
            line-height: 1.5;
        }

        /* Header */
        .page-header {
            background: var(--primary);
            padding: 14px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            color: white;
        }

        .back-btn {
            background: rgba(255,255,255,0.2);
            border: 1px solid rgba(255,255,255,0.35);
            color: white;
            border-radius: 6px;
            padding: 6px 12px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            flex-shrink: 0;
        }
        .back-btn:hover { background: rgba(255,255,255,0.3); }

        .page-title { font-size: 17px; font-weight: 700; }
        .page-subtitle { font-size: 12px; opacity: 0.75; }

        /* Tabs */
        .tabs {
            display: flex;
            background: var(--card);
            border-bottom: 2px solid var(--border);
            padding: 0 16px;
        }

        .tab {
            padding: 12px 16px;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-2);
            cursor: pointer;
            border: none;
            background: none;
            border-bottom: 2px solid transparent;
            margin-bottom: -2px;
            transition: color 0.15s;
        }
        .tab.active {
            color: var(--primary);
            border-bottom-color: var(--primary);
        }

        /* Content */
        .tab-content { display: none; padding: 14px 16px; }
        .tab-content.active { display: block; }

        .notification-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        /* Notification card */
        .notification-item {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 14px;
        }

        .notification-item .arabic {
            font-size: 18px;
            direction: rtl;
            text-align: right;
            font-family: 'Times New Roman', serif;
            color: var(--text);
            line-height: 1.8;
            margin-bottom: 10px;
        }

        .notification-item .translation {
            font-size: 13px;
            color: var(--text-2);
            line-height: 1.6;
            margin-bottom: 6px;
        }

        .notification-item .info {
            font-size: 11px;
            color: var(--primary);
            font-weight: 600;
            direction: rtl;
            text-align: right;
            margin-bottom: 12px;
        }

        .actions {
            display: flex;
            gap: 8px;
            padding-top: 10px;
            border-top: 1px solid var(--border);
        }

        .action-btn {
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
            border: 1.5px solid var(--border);
            background: white;
            color: var(--text-2);
            transition: all 0.15s;
        }
        .action-btn:hover { border-color: var(--primary); color: var(--primary); }

        .action-btn.favorite {
            border-color: var(--green);
            color: var(--green);
        }
        .action-btn.delete {
            border-color: #fca5a5;
            color: var(--red);
        }
        .action-btn.delete:hover { background: var(--red-light); }

        /* Empty state */
        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-2);
            font-size: 13px;
            font-style: italic;
        }
    </style>
</head>
<body>
    <div class="page-header">
        <button class="back-btn" id="back-btn">← Back</button>
        <div>
            <div class="page-title">Notification History</div>
            <div class="page-subtitle">Saved Quran ayahs &amp; reminders</div>
        </div>
    </div>

    <div class="tabs">
        <button class="tab active" data-tab="history">History</button>
        <button class="tab" data-tab="favorites">⭐ Favorites</button>
    </div>

    <div id="history" class="tab-content active">
        <div id="history-list" class="notification-list"></div>
    </div>

    <div id="favorites" class="tab-content">
        <div id="favorites-list" class="notification-list"></div>
    </div>

    <script src="history.js"></script>
</body>
</html>
